<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockhouse — Set up your company</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f4f7fa; font-family: 'Albert Sans', system-ui, sans-serif; color: #151b23; }
  a { color: #1960bd; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 440px; background: #ffffff; border: 1px solid #e5eaf1; border-radius: 18px; box-shadow: 0 24px 64px rgba(21,27,35,0.08); padding: 40px 36px; text-align: center; }

  .mark { width: 52px; height: 52px; border-radius: 14px; background: #e8f0fc; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { font-size: 13.5px; font-weight: 500; color: #6e8aab; line-height: 1.55; margin: 0 0 6px; }
  .progress-note { font-size: 12px; font-weight: 700; color: #1960bd; background: #e8f0fc; display: inline-block; padding: 6px 12px; border-radius: 999px; margin: 18px 0 26px; }

  .cta { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px; border: 0; background: #1960bd; color: #ffffff; font-size: 13.5px; font-weight: 700; box-shadow: 0 1px 2px rgba(25,96,189,0.25); }
  .cta:hover { background: #124287; }
  .back-link { display: block; margin-top: 18px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1960bd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>
    </div>
    <h1>Let's set up your company</h1>
    <p>The guided setup — company details, your first warehouse, starting inventory, branding and team invites — is being built next.</p>
    <div class="progress-note">Company setup · coming next</div>
    <div>
      <a class="cta" href="dashboard.html">Explore the demo workspace instead →</a>
    </div>
    <a class="back-link" href="login.html">← Back to log in</a>
  </div>
</div>

</body>
</html>
