<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockhouse — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Quicksand', system-ui, sans-serif; color: #1e2a3a; }
  button, input { font-family: inherit; }
  a { color: #1851a0; text-decoration: none; }
  a:hover { color: #123a72; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #cee6fc 0%, #f2e2ec 52%, #f9ddec 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    position: relative;
  }

  .page-logo { position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 10px; }
  .page-logo svg { display: block; }
  .page-logo b { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 700; color: #1851a0; letter-spacing: -0.01em; }

  .auth-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 22px;
    padding: 44px 40px 40px;
    box-shadow: 0 24px 64px rgba(24,58,114,0.14), 0 4px 14px rgba(24,58,114,0.08);
  }

  .form-head h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; color: #16233a; }
  .form-head p { font-size: 13.5px; font-weight: 500; color: #7186a3; margin: 0 0 26px; }

  .seg { display: flex; padding: 3px; background: #f0f4fa; border-radius: 12px; margin-bottom: 24px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 10px 0; border-radius: 9px; font-size: 13px; font-weight: 700; color: #7186a3; cursor: pointer; transition: background .15s, color .15s; font-family: 'Quicksand', sans-serif; }
  .seg button.active { background: #ffffff; color: #16233a; box-shadow: 0 1px 3px rgba(24,58,114,0.12); }

  .field-group { margin-bottom: 15px; }
  .field-group label { display: block; font-size: 12.5px; font-weight: 700; color: #384c66; margin-bottom: 6px; }
  .field-input { position: relative; }
  .field-input input {
    width: 100%; font-size: 13.5px; font-weight: 500; color: #16233a;
    border: 1.5px solid #dbe6f4; border-radius: 11px; padding: 11px 13px;
    background: #fbfdff; outline: 0; transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .field-input input:focus { border-color: #1851a0; background: #ffffff; box-shadow: 0 0 0 3.5px rgba(24,81,160,0.12); }
  .field-input input.pw { padding-right: 40px; }
  .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #93a8c2; cursor: pointer; border-radius: 8px; }
  .pw-toggle:hover { background: #f4f7fc; color: #5c7191; }
  .field-err { font-size: 11.5px; font-weight: 600; color: #d3455a; margin-top: 5px; display: none; }
  .field-group.invalid .field-input input { border-color: #d3455a; }
  .field-group.invalid .field-err { display: block; }

  .terms-row { display: flex; align-items: flex-start; gap: 9px; margin: 2px 0 20px; }
  .terms-row input[type="checkbox"] { appearance: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #c7d6ea; background: #fff; flex-shrink: 0; margin-top: 1px; cursor: pointer; position: relative; transition: background .12s, border-color .12s; }
  .terms-row input[type="checkbox"]:checked { background: #1851a0; border-color: #1851a0; }
  .terms-row input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .terms-row label { font-size: 12.5px; font-weight: 500; color: #5c7191; line-height: 1.5; cursor: pointer; }

  .row-between { display: flex; align-items: center; justify-content: flex-end; margin: -3px 0 20px; }
  .row-between a { font-size: 12.5px; font-weight: 700; }

  .submit-btn {
    width: 100%; padding: 12.5px 0; border-radius: 11px; border: 0; background: #1851a0; color: #ffffff;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif;
    box-shadow: 0 1px 2px rgba(24,81,160,0.25), 0 6px 16px rgba(24,81,160,0.18);
    transition: background .12s, opacity .12s;
  }
  .submit-btn:hover { background: #123a72; }
  .submit-btn:disabled { background: #b7c6dd; cursor: not-allowed; box-shadow: none; }

  .demo-note { text-align: center; font-size: 11.5px; font-weight: 500; color: #93a8c2; margin-top: 14px; }

  .switch-foot { text-align: center; font-size: 13px; font-weight: 500; color: #5c7191; margin-top: 22px; }
  .switch-foot a { font-weight: 700; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 20px; }
  .divider .line { flex: 1; height: 1px; background: #e8eef7; }
  .divider span { font-size: 11px; font-weight: 700; color: #93a8c2; text-transform: uppercase; letter-spacing: 0.05em; }

  .oauth-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px 0; border-radius: 11px; border: 1px solid #dbe6f4; background: #ffffff; font-size: 13.5px; font-weight: 700; color: #16233a; cursor: pointer; transition: background .12s, border-color .12s; font-family: 'Quicksand', sans-serif; }
  .oauth-btn:hover { background: #f7fafd; border-color: #cfdcee; }

  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  .toast-wrap.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 10px; background: #16233a; color: #ffffff; font-size: 13px; font-weight: 600; box-shadow: 0 12px 28px rgba(22,35,58,0.28); white-space: nowrap; font-family: 'Quicksand', sans-serif; }

  @media (max-width: 560px) {
    .page-logo { left: 22px; top: 22px; }
    .auth-card { padding: 36px 24px 32px; margin-top: 56px; }
  }
</style>
</head>
<body>

<div class="page-logo" aria-hidden="true">
  <svg width="26" height="25" viewBox="0 0 24 23" fill="#1851a0" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0 24 3.5 12 7 0 3.5Z"></path>
    <path d="M12 8 24 11.5 12 15 0 11.5Z"></path>
    <path d="M12 16 24 19.5 12 23 0 19.5Z"></path>
  </svg>
</div>

<main class="auth-card">
  <div class="form-head">
    <h2 id="formTitle">Welcome back</h2>
    <p id="formSubtitle">Log in to your Stockhouse workspace</p>
  </div>

  <div class="seg" role="tablist">
    <button type="button" id="tabLogin" class="active" role="tab" aria-selected="true">Log In</button>
    <button type="button" id="tabSignup" role="tab" aria-selected="false">Create Account</button>
  </div>

  <form id="authForm" novalidate>
    <div class="field-group" id="fgName" style="display:none;">
      <label for="fName">Full Name</label>
      <div class="field-input"><input type="text" id="fName" autocomplete="name" placeholder="Abhishek Gupta"></div>
      <div class="field-err">Enter your full name</div>
    </div>

    <div class="field-group" id="fgEmail">
      <label for="fEmail">Work Email</label>
      <div class="field-input"><input type="email" id="fEmail" autocomplete="email" placeholder="your@company.com"></div>
      <div class="field-err">Enter a valid email address</div>
    </div>

    <div class="field-group" id="fgPassword">
      <label for="fPassword">Password</label>
      <div class="field-input">
        <input type="password" id="fPassword" class="pw" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-err">Enter your password</div>
    </div>

    <div class="row-between" id="forgotRow">
      <a href="#" id="forgotLink">Forgot Password?</a>
    </div>

    <div class="terms-row" id="termsRow" style="display:none;">
      <input type="checkbox" id="fTerms">
      <label for="fTerms">I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#" id="privacyLink">Privacy Policy</a></label>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn" disabled>Login</button>
    <div class="demo-note" id="demoNote">Demo mode — any email &amp; password will log you in.</div>
  </form>

  <div class="switch-foot" id="switchFoot">
    New to Stockhouse? <a href="#" id="switchToSignup">Create an account</a>
  </div>

  <div class="divider"><div class="line"></div><span>Or continue with</span><div class="line"></div></div>

  <button type="button" class="oauth-btn" id="googleBtn">
    <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.3 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.9 6.5 29.2 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l6-6C33.9 6.5 29.2 4.5 24 4.5c-7.5 0-14 4.2-17.3 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.2 0 9.8-1.9 13.4-5l-6.2-5.2C29.2 34.9 26.7 35.8 24 35.8c-5.2 0-9.6-3.5-11.2-8.3l-6.5 5C9.4 39.3 16.1 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.2 5.2C40.9 36 43.5 30.5 43.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>
    <span>Continue with Google</span>
  </button>
</main>

<div class="toast-wrap" id="toastWrap"><div class="toast" id="toastMsg"></div></div>

<script>
(function () {
  var mode = 'login'; // 'login' | 'signup'

  var tabLogin = document.getElementById('tabLogin');
  var tabSignup = document.getElementById('tabSignup');
  var formTitle = document.getElementById('formTitle');
  var formSubtitle = document.getElementById('formSubtitle');
  var fgName = document.getElementById('fgName');
  var termsRow = document.getElementById('termsRow');
  var forgotRow = document.getElementById('forgotRow');
  var submitBtn = document.getElementById('submitBtn');
  var demoNote = document.getElementById('demoNote');
  var switchFoot = document.getElementById('switchFoot');
  var authForm = document.getElementById('authForm');
  var fName = document.getElementById('fName');
  var fEmail = document.getElementById('fEmail');
  var fPassword = document.getElementById('fPassword');
  var fTerms = document.getElementById('fTerms');
  var pwToggle = document.getElementById('pwToggle');

  function setMode(next) {
    mode = next;
    var isSignup = mode === 'signup';
    tabLogin.classList.toggle('active', !isSignup);
    tabSignup.classList.toggle('active', isSignup);
    tabLogin.setAttribute('aria-selected', String(!isSignup));
    tabSignup.setAttribute('aria-selected', String(isSignup));

    fgName.style.display = isSignup ? '' : 'none';
    termsRow.style.display = isSignup ? 'flex' : 'none';
    forgotRow.style.display = isSignup ? 'none' : 'flex';

    if (isSignup) {
      formTitle.textContent = 'Create your account';
      formSubtitle.textContent = 'Set up Stockhouse for your team in minutes';
      submitBtn.textContent = 'Create account';
      demoNote.textContent = 'Demo mode — we’ll email you a verification code next.';
      switchFoot.innerHTML = 'Already have an account? <a href="#" id="switchToLogin">Log in</a>';
    } else {
      formTitle.textContent = 'Welcome back';
      formSubtitle.textContent = 'Log in to your Stockhouse workspace';
      submitBtn.textContent = 'Login';
      demoNote.textContent = 'Demo mode — any email & password will log you in.';
      switchFoot.innerHTML = 'New to Stockhouse? <a href="#" id="switchToSignup">Create an account</a>';
    }
    bindSwitchLink();
    validate();
  }

  function bindSwitchLink() {
    var link = document.getElementById(mode === 'signup' ? 'switchToLogin' : 'switchToSignup');
    if (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        setMode(mode === 'signup' ? 'login' : 'signup');
      });
    }
  }

  tabLogin.addEventListener('click', function () { setMode('login'); });
  tabSignup.addEventListener('click', function () { setMode('signup'); });
  bindSwitchLink();

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function validate() {
    var ok = true;
    if (!EMAIL_RE.test(fEmail.value.trim())) ok = false;
    if (fPassword.value.length < 4) ok = false;
    if (mode === 'signup') {
      if (fName.value.trim().length < 2) ok = false;
      if (!fTerms.checked) ok = false;
    }
    submitBtn.disabled = !ok;
    return ok;
  }

  [fName, fEmail, fPassword].forEach(function (el) {
    el.addEventListener('input', function () {
      el.closest('.field-group').classList.remove('invalid');
      validate();
    });
  });
  fTerms.addEventListener('change', validate);

  pwToggle.addEventListener('click', function () {
    var showing = fPassword.type === 'text';
    fPassword.type = showing ? 'password' : 'text';
    pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Password reset isn’t available in this demo');
  });
  document.getElementById('termsLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Terms of Service isn’t available in this demo');
  });
  document.getElementById('privacyLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Privacy Policy isn’t available in this demo');
  });

  document.getElementById('googleBtn').addEventListener('click', function () {
    showToast('Google sign-in isn’t available in this demo');
  });

  var toastTimer = null;
  function showToast(msg) {
    var wrap = document.getElementById('toastWrap');
    document.getElementById('toastMsg').textContent = msg;
    wrap.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { wrap.classList.remove('show'); }, 2600);
  }

  authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validate()) {
      if (mode === 'signup' && fName.value.trim().length < 2) fgName.classList.add('invalid');
      if (!EMAIL_RE.test(fEmail.value.trim())) document.getElementById('fgEmail').classList.add('invalid');
      if (fPassword.value.length < 4) document.getElementById('fgPassword').classList.add('invalid');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';
    try {
      if (mode === 'signup') {
        localStorage.setItem('stockhouseSignupName', fName.value.trim());
        localStorage.setItem('stockhouseSignupEmail', fEmail.value.trim());
      } else {
        localStorage.setItem('stockhouseAuthed', '1');
      }
    } catch (e) {}
    setTimeout(function () {
      window.location.href = mode === 'signup' ? 'otp-verify.html' : 'dashboard.html';
    }, 450);
  });

  // Deep-link support: login.html?tab=signup
  var params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'signup') setMode('signup');
})();
</script>

</body>
</html>
