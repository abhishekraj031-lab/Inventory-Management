<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockhouse — Verify your phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f4f7fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #151b23; }
  button, input { font-family: inherit; }
  a { color: #1960bd; text-decoration: none; }
  a:hover { color: #124287; }

  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 420px; background: #ffffff; border: 1px solid #e5eaf1; border-radius: 18px; box-shadow: 0 24px 64px rgba(21,27,35,0.08), 0 2px 8px rgba(21,27,35,0.04); padding: 40px 38px; text-align: center; }

  .mark { width: 52px; height: 52px; border-radius: 14px; background: #1960bd; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; box-shadow: 0 6px 16px rgba(25,96,189,0.22); }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { font-size: 13.5px; font-weight: 500; color: #6e8aab; line-height: 1.55; margin: 0 0 4px; }
  .phone-num { font-weight: 700; color: #151b23; }
  .change-link { font-size: 12.5px; font-weight: 700; display: inline-block; margin-top: 4px; margin-bottom: 26px; }

  .otp-row { display: flex; gap: 9px; justify-content: center; margin-bottom: 8px; }
  .otp-row input {
    width: 44px; height: 52px; text-align: center; font-size: 20px; font-weight: 700; color: #151b23;
    border: 1.5px solid #dde5ef; border-radius: 11px; outline: 0; background: #ffffff;
    transition: border-color .12s, box-shadow .12s;
  }
  .otp-row input:focus { border-color: #1960bd; box-shadow: 0 0 0 3.5px rgba(25,96,189,0.12); }
  .otp-row input.filled { border-color: #b9c7db; }
  .otp-err { font-size: 11.5px; font-weight: 600; color: #d33a3a; margin: 8px 0 0; display: none; height: 14px; }
  .otp-err.show { display: block; }

  .resend-row { font-size: 12.5px; font-weight: 500; color: #9aacc2; margin: 20px 0 26px; }
  .resend-row a { font-weight: 700; }

  .submit-btn {
    width: 100%; padding: 12.5px 0; border-radius: 10px; border: 0; background: #1960bd; color: #ffffff;
    font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(25,96,189,0.25), 0 6px 16px rgba(25,96,189,0.16);
    transition: background .12s, opacity .12s;
  }
  .submit-btn:hover { background: #124287; }
  .submit-btn:disabled { background: #b9c7db; cursor: not-allowed; box-shadow: none; }

  .demo-note { font-size: 11.5px; font-weight: 500; color: #9aacc2; margin-top: 14px; }
  .back-link { display: block; margin-top: 20px; font-size: 13px; font-weight: 600; }

  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  .toast-wrap.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 10px; background: #151b23; color: #ffffff; font-size: 13px; font-weight: 600; box-shadow: 0 12px 28px rgba(21,27,35,0.28); white-space: nowrap; }

  @media (max-width: 460px) {
    .card { padding: 32px 22px; }
    .otp-row { gap: 7px; }
    .otp-row input { width: 38px; height: 46px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg></div>
    <h1>Verify your phone</h1>
    <p>Enter the 6-digit code sent to<br><span class="phone-num" id="phoneDisplay">your phone</span></p>
    <a href="login.html?tab=signup" class="change-link">Wrong number? Change it</a>

    <form id="otpForm" novalidate>
      <div class="otp-row" id="otpRow">
        <input type="text" inputmode="numeric" maxlength="1" data-i="0">
        <input type="text" inputmode="numeric" maxlength="1" data-i="1">
        <input type="text" inputmode="numeric" maxlength="1" data-i="2">
        <input type="text" inputmode="numeric" maxlength="1" data-i="3">
        <input type="text" inputmode="numeric" maxlength="1" data-i="4">
        <input type="text" inputmode="numeric" maxlength="1" data-i="5">
      </div>
      <div class="otp-err" id="otpErr">Enter all 6 digits</div>

      <div class="resend-row">Didn't get a code? <a href="#" id="resendLink">Resend OTP</a></div>

      <button type="submit" class="submit-btn" id="verifyBtn" disabled>Verify &amp; continue</button>
      <div class="demo-note">Demo mode — enter any 6 digits to continue.</div>
    </form>

    <a class="back-link" href="login.html">← Back to log in</a>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"><div class="toast" id="toastMsg"></div></div>

<script>
(function () {
  var inputs = Array.prototype.slice.call(document.querySelectorAll('.otp-row input'));
  var verifyBtn = document.getElementById('verifyBtn');
  var otpErr = document.getElementById('otpErr');
  var phoneDisplay = document.getElementById('phoneDisplay');

  var phone = '';
  try { phone = localStorage.getItem('stockhouseSignupPhone') || ''; } catch (e) {}
  phoneDisplay.textContent = phone || 'your phone';

  function currentCode() {
    return inputs.map(function (i) { return i.value; }).join('');
  }

  function updateState() {
    var code = currentCode();
    var complete = code.length === 6 && /^\d{6}$/.test(code);
    inputs.forEach(function (i) { i.classList.toggle('filled', i.value !== ''); });
    verifyBtn.disabled = !complete;
    return complete;
  }

  inputs.forEach(function (input, idx) {
    input.addEventListener('input', function () {
      input.value = input.value.replace(/\D/g, '').slice(0, 1);
      otpErr.classList.remove('show');
      if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      updateState();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !input.value && idx > 0) {
        inputs[idx - 1].focus();
      }
    });
    input.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (!text) return;
      e.preventDefault();
      text.slice(0, 6).split('').forEach(function (ch, i) {
        if (inputs[i]) inputs[i].value = ch;
      });
      var next = Math.min(text.length, inputs.length - 1);
      inputs[next].focus();
      updateState();
    });
  });

  var toastTimer = null;
  function showToast(msg) {
    var wrap = document.getElementById('toastWrap');
    document.getElementById('toastMsg').textContent = msg;
    wrap.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { wrap.classList.remove('show'); }, 2600);
  }

  document.getElementById('resendLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('A new code isn’t sent in this demo — any 6 digits will work');
  });

  document.getElementById('otpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!updateState()) { otpErr.classList.add('show'); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verifying…';
    setTimeout(function () {
      window.location.href = 'onboarding.html';
    }, 450);
  });

  inputs[0].focus();
})();
</script>

</body>
</html>
